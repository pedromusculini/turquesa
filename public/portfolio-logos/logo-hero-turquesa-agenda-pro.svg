<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" fill="none" role="img" aria-label="Turquesa Agenda">
  <defs>
    <linearGradient id="turquesa-grad" x1="430" y1="28" x2="430" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F4F5"/>
    </linearGradient>
    <linearGradient id="agenda-grad" x1="430" y1="158" x2="430" y2="206" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F2E0C8"/>
      <stop offset="1" stop-color="#c69c6c"/>
    </linearGradient>
    <filter id="wordmark-shadow" x="-8%" y="-12%" width="116%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#023840" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#wordmark-shadow)">
    <text
      x="430"
      y="102"
      text-anchor="middle"
      fill="url(#turquesa-grad)"
      font-family="'Cormorant Garamond', 'Libre Baskerville', Georgia, 'Times New Roman', Times, serif"
      font-size="82"
      font-weight="500"
      letter-spacing="0.14em"
    >TURQUESA</text>

    <line x1="268" y1="132" x2="404" y2="132" stroke="#3795a1" stroke-width="1.25" stroke-opacity="0.5" stroke-linecap="round"/>
    <line x1="456" y1="132" x2="592" y2="132" stroke="#3795a1" stroke-width="1.25" stroke-opacity="0.5" stroke-linecap="round"/>
    <circle cx="430" cy="132" r="5" fill="#c69c6c" opacity="0.9"/>
    <circle cx="430" cy="132" r="2.25" fill="#F2E0C8"/>

    <text
      x="430"
      y="194"
      text-anchor="middle"
      fill="url(#agenda-grad)"
      font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-size="38"
      font-weight="500"
      letter-spacing="0.38em"
    >AGENDA</text>
  </g>
</svg>
